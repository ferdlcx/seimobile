name: Build APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd frontend
          flutter pub get

      - name: Analyze Code
        run: |
          cd frontend
          flutter analyze --no-fatal-infos

      - name: Run Tests
        run: |
          cd frontend
          flutter test

      - name: Build APK (Release)
        run: |
          cd frontend
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: seui-centre-release-apk
          path: frontend/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: S.E.U.I Centre v1.2.0
          body: |
            ## S.E.U.I Centre Mobile - Release v1.2.0
            Aplikasi murni Dart & Flutter dengan database SQLite lokal persisten (`seui_centre.db`).

            ### Perbaikan & Peningkatan Alur Kerja:
            - **Sinkronisasi Real-time Lintas Peran & Layar**: Penambahan akun Sales, wilayah, toko baru, mapping, jurnal, maupun approval reschedule langsung sinkron tanpa perlu menutup atau me-restart aplikasi.
            - **Kelola Wilayah**: Admin Tagihan kini dapat langsung menambah data **Wilayah** dari menu Data Master -> tab Wilayah.
            - **Pilih Sales di Susun Mapping**: Admin Tagihan dapat memilih sales aktif saat menyusun mapping toko 12 bulan.
            - **Jenis Aktivitas & Edit Jurnal Sales**: Form jurnal kini mendukung pilihan aktivitas (**Kunjungan & Order**, **Pengambilan Barang**, **Penagihan**) serta pengeditan jurnal final yang sudah dibuat.
            - **Mode Rangkap Manajer Sales**: Tombol kembali ke Mode Manajer langsung tersedia di layar Mapping Sales.

            ### Unduhan APK:
            Unduh file `app-release.apk` di bawah ini dan instal langsung di perangkat Android Anda.
          files: frontend/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
