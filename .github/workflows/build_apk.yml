name: Build APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd frontend
          flutter pub get

      - name: Run Tests
        run: |
          cd frontend
          flutter test

      - name: Build APK (Release)
        run: |
          cd frontend
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: seui-centre-release-apk
          path: frontend/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: S.E.U.I Centre v1.0.0
          body: |
            ## S.E.U.I Centre Mobile - Release v1.0.0
            Aplikasi Sistem Informasi Mapping, Aktivitas, dan Kondite Sales.

            ### Fitur Utama:
            - **Admin Tagihan**: Akun & Hak Akses, Master Data (Toko, Sales, Wilayah, Kriteria), Susun Mapping Grid Excel (12 Bulan), Laporan Rekap & Cetak PDF.
            - **Sales**: Mapping Hari Ini, GPS Check-in Radius 50m, Wizard Jurnal Kunjungan (Ada Order / Tidak Ada Order / Toko Tutup + Foto PO & Display), Pengajuan Reschedule, Lembar Kondite Saya (18 Kriteria Read-only).
            - **Manajer Sales**: Monitoring Beranda (Kunjungan, Order, Reschedule), Mode Sales Merangkap, Approval Reschedule, Penilaian Kondite 18 Kriteria Dinamis & Cetak Dokumen Resmi PDF ber-TTD Digital.

            ### Unduhan APK:
            Unduh file `app-release.apk` di bawah ini dan instal langsung di perangkat Android Anda.
          files: frontend/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
